[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ──────────────────────────────────────────────────────────────
# SPA: semua rute dilempar ke index.html
# ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ──────────────────────────────────────────────────────────────
# v5.5 — CACHE-CONTROL
#
# Vite menaruh seluruh JS/CSS hasil build di /assets/ dengan hash isi di
# nama filenya (index-BDUevnx2.css). Isi file itu TIDAK PERNAH berubah:
# begitu ada perubahan kode, hash-nya berganti dan namanya jadi file baru.
# Karena itu aman di-cache satu tahun dengan `immutable` — browser tidak
# akan menanyakannya lagi sama sekali.
#
# index.html sebaliknya HARUS selalu diperiksa ulang. File inilah yang
# memuat daftar nama chunk terbaru. Kalau ia ikut di-cache lama, user akan
# terus membuka versi lama meski Netlify sudah deploy versi baru.
# ──────────────────────────────────────────────────────────────

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ──────────────────────────────────────────────────────────────
# Header keamanan dasar
# ──────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
